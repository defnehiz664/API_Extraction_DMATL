# =============================================================================
# Copper PROJECT SCHEMA
# Copper alloys, microstructure, bench test results
# and mechanical properties.
# =============================================================================

project: copper
material_system: "Copper (Cu) and Cu-based alloys"
record_id_prefix: "Cu"

# -----------------------------------------------------------------------------
# DOMAIN RULES
# This block is injected verbatim into the Gemini extraction prompt.
# A different student project would replace this block with their own domain rules.
# -----------------------------------------------------------------------------
domain_rules: |
  COMPOSITION:
  - composition_type must be exactly one of: pure, doped, alloy
    - pure = a near-pure base-metal system with no intentional dopants
      (e.g. Cu >= 99.9% or another base metal near-pure)
    - doped = a base metal with trace intentional additions below about 1 wt%
      of elements such as Ti, Zr, Nb, Ta, W, Cr, Mn, Fe, Ni, Co, Al, Si,
      Sn, Zn, Mg, Li, Be, P, S, O, N, C, Te, etc.
    - alloy = a system with significant alloying additions of major elements
      such as Ni, Co, Cr, Mn, Fe, Ti, Zr, Nb, Ta, W, Al, Si, Sn, Zn, Mg,
      Cu, Ag, Pb, Sb, Bi, or related elements
  - Known element symbols in this project (from the VEC lookup table):
    Cu, Ag, Al, Si, Zn, Sn, Ni, Co, Mn, Mg, Fe, Cr, P, Pb, Sb, Bi,
    Ti, Zr, W, Nb, Ta, Li, Cd, S, Be, O, C, N, Te
  - dopant_concentration_unit must be exactly one of: ppm, wt%, at%

  CALCULATED DESCRIPTORS — DO NOT CALCULATE THESE, leave them null:
  - VEC, delta_H_mix_kJ_mol, delta_S_mix_J_mol_K, delta_atomic_size:
    Leave ALL of these as null. They will be computed later by the
    database/feature pipeline from the composition fields you extracted.
    Do not attempt to calculate them manually in the extraction step.

  GRAIN SIZE:
  - grain_size_L_um = longitudinal / rolling direction (RD/LD)
  - grain_size_T_um = transverse direction (TD)
  - grain_size_S_um = short-transverse / normal direction (ND, thickness direction)
  - grain_size_estimated_dimensions must be exactly one of:
    none / partial / x_y_estimated / single_direction_only /
    reported_as_D10_D50_D90_distribution_not_xyz
  - Match paper coordinate system (x/y/z notation) to L/T/S from the paper's
    description of rolling/forging geometry.

  DISLOCATION DENSITY:
  - pre_existing_dislocation_density_m2: units must be m^-2 (not cm^-2).
    Use this for the dislocation density present in the material before any
    additional deformation or testing event, if explicitly reported.
    Typical values are often in the range 10^10 to 10^14 m^-2 for heavily
    processed or deformed metallic materials, but report the paper's value
    directly when given.
    Conversion: 1 cm^-2 = 10^4 m^-2 (so 10^7 cm^-2 = 10^11 m^-2).
  - dislocation_structure_description: describe the observed dislocation
    arrangement (e.g. cell walls, tangles, planar arrays, stacking faults,
    twins, or other characteristic structures).
  - dislocation_density_method: record the measurement method if stated
    (e.g. EBSD, TEM, XRD line broadening, etch-pit counting).

  PROCESSING:
  - deformation_process (REQUIRED): the primary deformation method — exactly one of:
    none / cold_rolling / hot_rolling / warm_rolling / rotary_swaging / drawing /
    extrusion / forging / ECAP / HPT / spark_plasma_sintering / sintering / other.
    "none" means no deformation processing (e.g. as-cast or only heat-treated).

  - material_condition: the metallurgical condition/temper — exactly one of:
    as_cast / annealed / recrystallized / cold_worked / solution_treated /
    solution_treated_and_aged / severe_plastic_deformation / other.
    This is the qualitative state only; the AMOUNT of cold work is equivalent_true_strain.
    It is independent of strengthening_mechanism — a sample can be e.g. peak-aged AND cold-worked.

  - processing_history: the full route in reading order, recorded verbatim (lightly normalised).
    This is the raw record; the fields below are the parsed values pulled out of it.
    Example: "solution_treated 980C/1h + water quench; cold_rolled 50%, 4 passes; aged 460C/4h".

  - equivalent_true_strain: the total imposed von Mises EQUIVALENT true strain, the single
    strain measure comparable across all deformation modes. Compute it if not stated directly:
      * rolling / drawing / swaging / extrusion: eps = ln(1/(1 - total_reduction)),
        with total_reduction as a fraction (50% -> 0.50).
      * multi-pass: sum the per-pass strains, eps = n * ln(1/(1 - r_per_pass)).
      * ECAP: about 1.15 per pass for a 90-degree die according to the Iwahashi equation; total = n * per-pass.
      * HPT or other SPD: use the standard process formula and record the geometric
        inputs (turns, radius, thickness, die angle) in processing_parameters.
    Do NOT keep a separate "logarithmic" and "cumulative" strain — this one field replaces both.

  - total_reduction_pct: the total thickness or area reduction as REPORTED, in % (the raw
    input to the strain). Record what the paper gives; equivalent_true_strain is derived from it.

  - number_of_passes: number of deformation passes/steps, if reported.

  - strain_rate_per_s: deformation strain rate in s^-1, if reported.

  - processing_parameters: process-SPECIFIC parameters not captured by the fields above,
    as key:value pairs with units, chosen according to deformation_process. Free text; null if none.
    Examples — ECAP: "route=Bc; die_angle=90deg; back_pressure=0MPa";
    rotary_swaging: "per_pass_reduction=15%; die=4-jaw";
    spark_plasma_sintering: "pressure=50MPa; dwell=5min; heating_rate=100C/min".

  HEAT TREATMENTS (temperature is meaningless without its step and its time — always pair them):
  - Record the standard steps in the named pairs: solution_treatment_temp_K / _time_min,
    aging_temp_K / _time_min, anneal_recrystallization_temp_K / _time_min.
  - Put any non-standard or multi-step schedule (step-ageing, step-quench, duplex anneals)
    in heat_treatment_steps as ordered "step:temp:time:cooling" entries.
  - aging_temp_K / aging_time_min are the most important for precipitation and spinodal alloys —
    always capture both when an ageing treatment is described.

  TEMPERATURE / TIME / UNIT CONVENTIONS (apply throughout processing):
  - All temperatures in Kelvin: convert from Celsius as K = C + 273.15; "RT" or "room
    temperature" ~= 293 K.
  - All hold times in MINUTES: convert hours to minutes (4 h -> 240) and record the original
    value in `notes`.
  - deformation_temperature_K is a WORKING temperature and belongs to processing.
    TEST temperatures (tensile, LCF) are NOT processing — they go in the test-context fields.

  LOADING DIRECTION:
  - loading_direction_relative_to_grain: describe relationship between loading /
    crack propagation and grain elongation direction.
    Examples: "along_L_direction" / "along_S_direction" / "L-T crack system"
  
  COMPOSITION STRING:
  - composition_string: compute this from the composition you extracted.
    Convert all concentrations to atomic fractions first, then format as
    element+fraction pairs with no spaces, e.g. "Cu0.85Cr0.12Zr0.03".
    Pure Cu = "Cu1". Trace dopants at ppm: include them, e.g. "Cu0.99994Ti0.00006".
    This field is used by the database pipeline to query Materials Project.
    Never leave it null if composition_type and concentrations are known.

    STRENGTHENING & COMPOSITION:
  - strengthening_mechanism — exactly one of: commercially_pure, solid_solution, precipitation,
    spinodal, dispersion, other. Record only what the authors state; leave null if not stated.
    The composition pattern that each mechanism produces (for the pipeline's later inference,
    NOT for you to guess the mechanism):
    * commercially_pure — no intentional additions.
    * solid_solution    — one substantial solute in solution; primary large, secondary usually absent.
    * precipitation     — dilute aged solutes; primary >> secondary, both small (Cu-Cr-Zr, Cu-Be, Cu-Ni-Si).
    * spinodal          — two comparable substantial co-additions (Cu-Ni-Sn); primary and secondary both large and similar.
    * dispersion        — inert compound particles in a near-pure matrix; use dispersoid_phase, not the element slots.
  -   Ordering rule: primary_addition is the intentional addition at the HIGHEST concentration,
    secondary_addition the next highest. If the paper mixes wt% and at%, compare on the same
    basis before deciding the order.
  - Element slots (primary/secondary/other) take element SYMBOLS only. Dispersoid compounds
    (Al2O3, Y2O3) go in dispersoid_phase, and their content is often given in vol%.

# -----------------------------------------------------------------------------
# FIELDS
# Each field becomes one entry in the dynamic Pydantic model AND one line
# in the Gemini extraction prompt. Keep descriptions concise — they are
# injected directly into the prompt.
# -----------------------------------------------------------------------------
fields:
  # ── IDENTITY ────────────────────────────────────────────────────────────────
  - name: record_id
    type: str
    description: "Leave null — assigned manually in Excel"

  - name: material_name
    type: str
    description: "Material name, e.g. 'pure Cu', 'Cu-Zn', 'Cu-3wt%P', 'Cu-0.1wt%Ti'"

  - name: commercial_grade_name
    type: str
    description: "Commercial or proprietary grade name, e.g. 'Glidcop-AL15', 'AMPCOLOY® 944'"

  
  # ── COMPOSITION & STRENGTHENING ──────────────────────────────────────────────
  - name: strengthening_mechanism
    type: str
    description: "Primary strengthening mechanism AS STATED by the authors — exactly one of:
      commercially_pure / solid_solution / precipitation / spinodal / dispersion / other.
      Leave null if the paper does not state or clearly describe it; do NOT infer it from the
      composition yourself. If several are described, choose the one the authors emphasise as
      dominant and note the others in `notes`."

  - name: base_material_purity_pct
    type: float
    unit: wt%
    description: "Cu (base metal) purity in wt%, e.g. 99.97. Typically reported for commercially pure grades."

  - name: trace_impurities
    type: str
    description: "Per-element UNINTENTIONAL impurities as element:value pairs with units,
      e.g. 'O:5ppm, Fe:10ppm, S:3ppm'. Free text. Do not put intentional alloying additions here."

  - name: primary_addition_element
    type: str
    description: "Element symbol of the INTENTIONAL addition at the HIGHEST concentration
      (the main alloying/strengthening element), e.g. 'Zn', 'Cr', 'Ni', 'Be'.
      Element symbol only — dispersoid compounds like Al2O3 go in dispersoid_phase."

  - name: primary_addition_concentration
    type: float
    description: "Numeric concentration of primary_addition_element (no units here)."

  - name: primary_addition_unit
    type: str
    description: "Unit for primary_addition_concentration — exactly one of: ppm / wt% / at%."

  - name: secondary_addition_element
    type: str
    description: "Element symbol of the intentional addition at the NEXT-highest concentration
      after the primary, if any, e.g. 'Zr' in Cu-Cr-Zr, 'Sn' in Cu-Ni-Sn. Element symbol only."

  - name: secondary_addition_concentration
    type: float
    description: "Numeric concentration of secondary_addition_element (no units here)."

  - name: secondary_addition_unit
    type: str
    description: "Unit for secondary_addition_concentration — exactly one of: ppm / wt% / at%."

  - name: other_additions
    type: str
    description: "Any further intentional alloying elements beyond primary and secondary,
      as element:value pairs with units, e.g. 'Si:0.6wt%, Mg:0.1wt%'. Free text. Null if none."

  - name: dispersoid_phase
    type: str
    description: "Inert dispersed second-phase COMPOUND for dispersion-strengthened (ODS) alloys,
      e.g. 'Al2O3', 'Y2O3'. An added or internally-oxidised particle, distinct from a precipitate
      formed by ageing the matrix. Null unless a dispersoid is present."

  - name: dispersoid_content
    type: float
    description: "Numeric content of dispersoid_phase (no units here)."

  - name: dispersoid_content_unit
    type: str
    description: "Unit for dispersoid_content — exactly one of: vol% / wt% / at%."


  # ── PROCESSING ───────────────────────────────────────────────────────────────
  - name: processing_history
    type: str
    description: "Full processing route, verbatim/normalised — the raw record other fields are parsed from."

  - name: material_condition
    type: str
    description: "Metallurgical condition/temper — exactly one of: as_cast / annealed /
      recrystallized / cold_worked / solution_treated / solution_treated_and_aged /
      severe_plastic_deformation / other. Qualitative state; the amount of cold work is the strain field below."

  - name: deformation_process
    type: str
    description: "REQUIRED. Primary deformation method — exactly one of: none / cold_rolling /
      hot_rolling / warm_rolling / rotary_swaging / drawing / extrusion / forging / ECAP / HPT /
      spark_plasma_sintering / sintering / other."

  - name: deformation_temperature_K
    type: float
    unit: K
    description: "Temperature during the primary deformation step. Null if not stated ('RT' means ~293 K)."

  - name: equivalent_true_strain
    type: float
    description: "Total imposed von Mises equivalent true strain — the cross-process strain measure.
      Rolling: ln(1/(1-total_reduction)). Multi-pass: sum per-pass strains. ECAP/HPT: process formula.
      Compute from reduction if not stated directly."

  - name: total_reduction_pct
    type: float
    unit: "%"
    description: "Total thickness/area reduction as reported (the raw input to the strain)."

  - name: number_of_passes
    type: float
    description: "Number of deformation passes/steps, if reported."

  - name: strain_rate_per_s
    type: float
    unit: "s^-1"
    description: "Deformation strain rate, if reported."

  - name: processing_parameters
    type: str
    description: "Process-SPECIFIC parameters not captured above, as key:value with units, guided by
      deformation_process. E.g. ECAP: 'route=Bc; die_angle=90deg'; swaging: 'per_pass_reduction=15%';
      SPS: 'pressure=50MPa; dwell=5min'. Free text; null if none."

  - name: solution_treatment_temp_K
    type: float
    unit: K
    description: "Solution-treatment (solutionizing) temperature, if performed."

  - name: solution_treatment_time_min
    type: float
    unit: min
    description: "Solution-treatment hold time, paired with solution_treatment_temp_K."

  - name: aging_temp_K
    type: float
    unit: K
    description: "Ageing temperature, if performed (key for precipitation/spinodal alloys)."

  - name: aging_time_min
    type: float
    unit: min
    description: "Ageing hold time, paired with aging_temp_K."

  - name: anneal_recrystallization_temp_K
    type: float
    unit: K
    description: "Annealing or recrystallization temperature, if performed."

  - name: anneal_recrystallization_time_min
    type: float
    unit: min
    description: "Annealing/recrystallization hold time, paired with the temperature above."

  - name: heat_treatment_steps
    type: str
    description: "Any non-standard or multi-step thermal schedule not captured by the named pairs above,
      as ordered step:temp:time:cooling entries. Free text; null if none."

  # ── MICROSTRUCTURE: GRAIN STRUCTURE (size, shape, texture) ────────────────────
  - name: grain_size_L_um
    type: float
    unit: um
    description: "Grain size in the longitudinal / rolling direction (RD/LD) in micrometres"

  - name: grain_size_T_um
    type: float
    unit: um
    description: "Grain size in the transverse direction (TD) in micrometres"

  - name: grain_size_S_um
    type: float
    unit: um
    description: "Grain size in the short-transverse / normal direction (ND) in micrometres"

  - name: grain_size_L_sd_um
    type: float
    unit: um
    description: "Standard deviation of grain_size_L_um"

  - name: grain_size_T_sd_um
    type: float
    unit: um
    description: "Standard deviation of grain_size_T_um"

  - name: grain_size_S_sd_um
    type: float
    unit: um
    description: "Standard deviation of grain_size_S_um"

  - name: grain_size_estimated_dimensions
    type: str
    description: "Which grain-size directions were actually reported — exactly one of:
      none / partial / x_y_estimated / single_direction_only /
      reported_as_D10_D50_D90_distribution_not_xyz"

  - name: grain_boundary_area_to_volume_per_um
    type: float
    unit: "um^-1"
    description: "CALCULATED: 1/L + 1/T + 1/S from the grain sizes. Never null if L/T/S known."

  - name: grain_aspect_ratio
    type: float
    description: "Grain aspect ratio (longest / shortest axis), if reported"

  - name: grain_morphology_qualitative
    type: str
    description: "Qualitative grain shape, e.g. 'equiaxed', 'elongated', 'pancake', 'fibrous'"

  - name: grain_size_distribution
    type: str
    description: "Spread/uniformity of grain sizes, e.g. 'narrow', 'bimodal', 'broad'"

  - name: crystallographic_texture
    type: str
    description: "Preferred orientation / texture, e.g. 'strong {110}<001> Goss', 'weak cube'"

  - name: grain_size_method
    type: str
    description: "Source of grain size — one of: optical / SEM / EBSD / TEM"

  - name: texture_method
    type: str
    description: "Source of texture — one of: EBSD / XRD"

  - name: phase_fraction_method
    type: str
    description: "Source of phase fractions — one of: SEM / EBSD / XRD"


  # dislocation_density_method already exists — extend its vocab to:
  #   XRD_line_profile / EBSD_KAM / TEM / etch_pit

  # ── MICROSTRUCTURE: GRAIN BOUNDARY CHARACTER ─────────────────────────────────
  - name: grain_boundary_CSL_fraction_pct
    type: float
    unit: "%"
    description: "Fraction of coincidence-site-lattice (CSL) special grain boundaries, in %"

  - name: twin_fraction_pct
    type: float
    unit: "%"
    description: "Twin boundary density or twin fraction, in % (note: annealing twins are common in Cu)"

  # ── MICROSTRUCTURE: SECOND-PHASE CONSTITUENTS ────────────────────────────────
  # Observed microstructure. Distinct from the composition block's designed
  # strengthening_mechanism / dispersoid_phase — record what is SEEN here.
  - name: phase_type_and_volume_fraction
    type: str
    description: "Constituent phases and their volume fractions as observed,
      e.g. 'alpha-Cu matrix + 5% Cr precipitate', 'alpha + beta brass 60/40'"

  - name: precipitate_size_distribution
    type: str
    description: "Observed second-phase precipitate size and spatial distribution, if present"

  - name: inclusion_content_distribution
    type: str
    description: "Non-metallic inclusion content and distribution, e.g. oxides (Cu2O), sulfides (MnS)"

  # ── MICROSTRUCTURE: DEFECT & DISLOCATION STRUCTURE ───────────────────────────
  - name: dislocation_density_m2
    type: float
    unit: "m^-2"
    description: "Dislocation density of the as-processed (pre-test) material in m^-2.
      Convert cm^-2 to m^-2 (x1e4) if needed; see domain rules."

  - name: dislocation_density_method
    type: str
    description: "Method used, e.g. 'EBSD', 'TEM', 'XRD line broadening', 'etch-pit counting'"

  - name: dislocation_structure_description
    type: str
    description: "Observed dislocation arrangement, e.g. 'cell walls', 'tangles', 'planar arrays', 'veins'"

  - name: kam_local_misorientation_deg
    type: float
    unit: deg
    description: "Kernel average misorientation (KAM), a proxy for local stored strain / GND density, in degrees"

  - name: persistent_slip_band_density
    type: str
    description: "Persistent slip band (PSB) prevalence, e.g. 'low', 'moderate', 'high' (fatigue-relevant)"

  - name: mobile_dislocation_fraction_pct
    type: float
    unit: "%"
    description: "Fraction of dislocations considered mobile, in % (rarely reported; often null)"

  
  # ── MECHANICAL PROPERTIES ────────────────────────────────────────────────────
  - name: measurement_method
    type: str
    description: "Test type used, e.g.  'tensile', 'LCF' "

  - name: elastic_modulus_GPa
    type: float
    unit: GPa
    description: "Young's modulus in GPa"

  - name: UTS_MPa
    type: float
    unit: MPa
    description: "Ultimate tensile strength in MPa"

  - name: yield_strength_MPa
    type: float
    unit: MPa
    description: "0.2% offset yield strength in MPa"

  - name: fracture_strength_MPa
    type: float
    unit: MPa
    description: "Fracture strength (stress at failure) in MPa, if distinct from UTS"

  - name: total_elongation_pct
    type: float
    unit: "%"
    description: "Total elongation at fracture in %"

  - name: mechanical_property_test_temp_K
    type: float
    unit: K
    description: "Temperature at which mechanical properties were measured, in Kelvin"

  - name: hardness_HV
    type: float
    unit: HV
    description: "Vickers hardness value"

  - name: hardness_HV_error_plus_or_minus
    type: float
    unit: HV
    description: "±error on the hardness value"

  - name: hardness_HV_test_load_kgf
    type: float
    unit: kgf
    description: "Test load for Vickers hardness, in kgf (e.g. 0.1 for HV0.1)"

  - name: hardness_HV_direction
    type: str
    description: "Direction of hardness indentation relative to grain, e.g. 'transversal_direction', 'normal_direction'"

  - name: loading_direction_relative_to_grain
    type: str
    description: "Relationship between loading/crack propagation and grain elongation (see domain rules)"

  - name: notch_fabrication_method
    type: str
    description: "How the notch was made, e.g. 'electrical discharge machining', 'razor blade'"

  - name: loading_rate_or_strain_rate
    type: str
    description: "Loading or strain rate, including units, e.g. '1 MPa m^0.5 s^-1', '10^-3 s^-1'"

  - name: monotonic_elongation_pct
    type: float
    unit: "%"
    description: "Monotonic ductility or elongation at fracture in %"

  - name: hardness_HB
    type: float
    unit: HB
    description: "Brinell hardness value if reported"

  - name: electrical_conductivity_S_per_m
    type: float
    unit: "S/m"
    description: "Electrical conductivity measured by four-point probe or equivalent method"

  - name: electrical_resistivity_ohm_m
    type: float
    unit: "Ω·m"
    description: "Electrical resistivity if conductivity is not reported"

# ── CHARACTERIZATION ──────────────────────────────────────────────

  - SEM:
    conditions: [ accelerating_voltage_kV, signal (SE/BSE), eds_used (bool) ]
    specimen:   [ examined_section (e.g. L-T plane / fracture_surface), surface_prep (polished/etched) ]
    results:    # SEM-exclusive: fractography (fatigue-critical), not in the microstructure layer
      - crack_initiation_site        # surface / subsurface / inclusion / pore / PSB / grain_boundary
      - fatigue_striation_spacing_um
      - fracture_mode                # transgranular_dimple / cleavage / intergranular / mixed
      - secondary_cracking_or_features
    # provenance only: SEM image analysis may also give grain size / morphology / phase fraction
    #   -> record those in the microstructure fields with method = SEM

  - EBSD:
    conditions: [ step_size_um, accelerating_voltage_kV, map_area_um2, indexing_rate_pct ]
    specimen:   [ examined_section ]
    results:    # EBSD-exclusive, beyond the shared grain/texture/KAM fields
      - HAGB_fraction_pct            # high-angle boundaries (>15 deg)
      - LAGB_fraction_pct            # low-angle
      - mean_misorientation_angle_deg
      - recrystallized_fraction_pct  # recrystallized / substructured / deformed partition
      - GND_density_m2               # geometrically necessary dislocation density from KAM
      - texture_components           # e.g. 'Cube 4x, Copper 2x' (multiples of random)
    # provenance: EBSD is usually the source for grain_size(L/T/S), aspect ratio, texture,
    #   CSL/twin fractions, KAM -> tag those in microstructure with method = EBSD

  - XRD:
    conditions: [ radiation (e.g. Cu_K_alpha), scan_range_2theta,
                  method (Rietveld / Williamson_Hall / modified_Warren_Averbach / sin2psi) ]
    specimen:   [ examined_surface_or_section ]
    results:    # XRD-exclusive
      - phases_identified            # phases + Rietveld wt%
      - lattice_parameter_angstrom
      - microstrain_rms_pct
      - crystallite_size_nm
      - dislocation_density_XRD_m2   # from line broadening (an alternative route)
      - stacking_fault_probability
    # provenance: XRD may also give phase fraction, texture, and residual stress (sin2psi,
    #   in the surface section) -> tag those with method = XRD

  - TEM:
    conditions: [ accelerating_voltage_kV, mode (BF/DF/weak_beam/HRTEM/STEM) ]
    specimen:   [ foil_plane (e.g. L-T), foil_prep (electropolished/FIB) ]
    results:    # TEM-exclusive
      - dislocation_density_TEM_m2       # weak-beam count; another route to compare
      - precipitate_mean_size_nm
      - precipitate_spacing_nm           # inter-particle spacing (drives Orowan strengthening)
      - precipitate_coherency            # coherent / semicoherent / incoherent
      - precipitate_phase_identified     # e.g. 'Cr', 'Cu5Zr', 'Ni2Si' (via SAED)
      - stacking_fault_energy_mJ_m2      # MEASURED here (node/ribbon/partial separation)
      - stacking_fault_width_nm
      - twin_thickness_nm
    # provenance: TEM is the usual source for dislocation_density, dislocation_structure,
    #   and precipitate_size_distribution -> tag those in microstructure with method = TEM

  # ── SURFACE CHARACTERIZATION ──────────────────────────────────────────────
  - name: surface_roughness_Ra_um
    type: float
    unit: um
    description: "Average surface roughness Ra in micrometres"

  - name: surface_roughness_Rz_um
    type: float
    unit: um
    description: "Surface roughness depth parameter such as Rz or valley depth in micrometres"

  - name: surface_topography_parameters
    type: str
    description: "Surface topography or optical microscopy parameters such as waviness, valley depth, or profile descriptors"

  - name: residual_stress_MPa
    type: float
    unit: MPa
    description: "Near-surface residual stress magnitude in MPa"

  - name: residual_stress_sign
    type: str
    description: "Sign of residual stress, e.g. 'compressive' or 'tensile'"

  # ── LOW-CYCLE FATIGUE ─────────────────────────────────────────────────────
  - name: fatigue_standard
    type: str
    description: "Fatigue test standard if reported, e.g. 'ISO 12106', 'ASTM E606'"

  - name: fatigue_ductility_coefficient
    type: float
    description: "Coffin-Manson fatigue ductility coefficient, often denoted as ε_f' or C_f"

  - name: fatigue_ductility_exponent
    type: float
    description: "Coffin-Manson fatigue ductility exponent, often denoted as c"

  - name: stress_amplitude_MPa
    type: float
    unit: MPa
    description: "Applied cyclic stress amplitude in MPa"

  - name: stress_ratio_R
    type: float
    description: "Stress ratio R = minimum/maximum stress if reported"

  - name: loading_frequency_Hz
    type: float
    unit: Hz
    description: "Loading frequency in Hz"

  - name: loading_type
    type: str
    description: "Loading mode such as axial, bending, torsional, or multiaxial"

  - name: fatigue_test_temperature_K
    type: float
    unit: K
    description: "Operating or test temperature during low-cycle fatigue testing in Kelvin"

  # ── SPECIMEN ─────────────────────────────────────────────────────────────────
  - name: specimen_form
    type: str
    description: "Form of the specimen, e.g. 'plate', 'rod', 'sheet', 'disc'"

  - name: specimen_thickness_mm
    type: float
    unit: mm
    description: "Specimen thickness in mm"

  - name: specimen_diameter_mm
    type: float
    unit: mm
    description: "Specimen diameter in mm (for round bar or disc specimens)"

  # ── PROVENANCE ───────────────────────────────────────────────────────────────
  - name: source_DOI
    type: str
    description: "DOI of the paper being extracted — always fill this"

  - name: source_figure_or_table
    type: str
    description: "Specific figure or table each value was extracted from, e.g. 'Table 2, Fig.3a'"

  - name: data_from_reference
    type: list[str]
    description: "Reference numbers that are the SOURCE of data points in this record (not background citations). Only fill if authors explicitly say data comes from another work. Example: [\"[5]\", \"[8]\"]"

  - name: reference_titles
    type: list[str]
    description: "Author-year strings matching entries in data_from_reference, in the same order. Example: [\"Smith 2019\", \"Jones et al. 2021\"]"

  - name: notes
    type: str
    description: "All uncertainties, methodology caveats, and derived values. Use tags: [methodology] [grain_size_methodology] [graph_read] [derived] [scope_caveat] [finding]"
